name: Offline toolchain probe

# Feasibility test for the OFFLINE Java engine (②). Split into two jobs like the
# working smoke test: build the probe (with the dexed toolchain) in one job, then
# run it on a clean emulator job. It compiles a Java file (with a lambda) to a
# classes.dex fully offline and reports PASS/FAIL + logs on a branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble + dex the toolchain into the probe assets
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          D8="$BT/lib/d8.jar"
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"
          [ -f "$AJ" ] || AJ=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          for V in 3.40.0 3.39.0 3.38.0 3.33.0; do
            curl -fsSL "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/$V/ecj-$V.jar" -o ecj.jar && break
          done
          # ECJ needs the java.compiler API (javax.lang.model / javax.tools /
          # javax.annotation.processing), absent on Android. The JDK 17 version's
          # SourceVersion.<clinit> calls Runtime.version() (not on ART), so take the
          # JDK 8 classes, which don't.
          RT8="${JAVA_HOME_8_X64:-/nope}/jre/lib/rt.jar"
          [ -f "$RT8" ] || RT8=$(ls /usr/lib/jvm/*8*/jre/lib/rt.jar 2>/dev/null | head -1)
          echo "rt8=$RT8"; ls -la "$RT8"
          mkdir -p jc
          unzip -q -o "$RT8" 'javax/lang/model/*' 'javax/annotation/processing/*' 'javax/tools/*' -d jc
          ( cd jc && jar cf "$GITHUB_WORKSPACE/javacompiler.jar" . )
          dex() { local o="$1"; shift; java -cp "$D8" com.android.tools.r8.D8 --release --min-api 26 --lib "$AJ" --output "$o" "$@"; }
          mkdir -p ecj_dex d8_dex
          dex ecj_dex ecj.jar javacompiler.jar
          dex d8_dex "$D8"
          OUT=offline-probe/app/src/main/assets/toolchain
          mkdir -p "$OUT"
          # A runnable dex-jar: keep the tool's own resources (.properties message
          # bundles, META-INF/services), drop the .class entries, add the dex.
          mk() { # $1 original jar, $2 dex dir, $3 output jar (relative to workspace)
            cp "$1" "$3"
            zip -q -d "$3" '*.class' >/dev/null 2>&1 || true
            ( cd "$2" && zip -q -g "$GITHUB_WORKSPACE/$3" classes*.dex )
          }
          mk ecj.jar ecj_dex "$OUT/ecj.dex.jar"
          mk "$D8" d8_dex "$OUT/d8.dex.jar"
          cp "$AJ" "$OUT/android.jar"
          rm -f "$OUT/.keep"
          echo "contents of ecj.dex.jar (sample):"; unzip -l "$OUT/ecj.dex.jar" | grep -E "classes.*dex|messages.properties" | head
          du -m "$OUT"/* | sort -n

      - name: Build the probe APK
        run: |
          cd offline-probe
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          ls -la app/build/outputs/apk/debug

      - uses: actions/upload-artifact@v4
        with:
          name: probe-apk
          path: offline-probe/app/build/outputs/apk/debug/app-debug.apk

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: probe-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile on an emulator (offline)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash offline-probe/probe.sh

      - name: Publish logs to probe-results branch
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p probe-out
          for f in probe.log logcat.txt install.txt; do [ -f "probe-out/$f" ] || echo "(missing $f — emulator step did not run)" > "probe-out/$f"; done
          cd probe-out
          git init -q -b probe-results
          git config user.name ci; git config user.email ci@users.noreply.github.com
          echo "run ${{ github.run_number }}" > RUN.txt
          git add -A; git commit -qm "probe ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-results
