name: Offline toolchain probe

# Feasibility test for the OFFLINE Java engine (②):
#  - assemble ECJ + D8 + android.jar and dex the tools for on-device use
#  - build a tiny probe app that bundles them
#  - on an emulator, COMPILE a Java file (with a lambda) to a classes.dex,
#    fully offline, and report PASS/FAIL.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble + dex the toolchain into the probe assets
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          D8="$BT/lib/d8.jar"
          AJ="$ANDROID_HOME/platforms/android-34/android.jar"
          [ -f "$AJ" ] || AJ=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          for V in 3.40.0 3.39.0 3.38.0 3.33.0; do
            curl -fsSL "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/$V/ecj-$V.jar" -o ecj.jar && break
          done
          dex() { java -cp "$D8" com.android.tools.r8.D8 --release --min-api 26 --lib "$AJ" --output "$2" "$1"; }
          mkdir -p ecj_dex d8_dex
          dex ecj.jar ecj_dex
          dex "$D8" d8_dex
          OUT=offline-probe/app/src/main/assets/toolchain
          mkdir -p "$OUT"
          (cd ecj_dex && zip -q "$GITHUB_WORKSPACE/$OUT/ecj.dex.jar" classes*.dex)
          (cd d8_dex && zip -q "$GITHUB_WORKSPACE/$OUT/d8.dex.jar" classes*.dex)
          cp "$AJ" "$OUT/android.jar"
          rm -f "$OUT/.keep"
          echo "toolchain sizes:"; du -m "$OUT"/* | sort -n

      - name: Build the probe APK
        run: |
          cd offline-probe
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          ls -la app/build/outputs/apk/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile on an emulator (offline)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -e
            adb wait-for-device
            adb install -r offline-probe/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.tammem.offlineprobe/.MainActivity
            D=/sdcard/Android/data/com.tammem.offlineprobe/files
            for i in $(seq 1 90); do
              if adb shell "test -f $D/PASS" 2>/dev/null; then ok=1; break; fi
              if adb shell "test -f $D/FAIL" 2>/dev/null; then ok=0; break; fi
              sleep 3
            done
            echo "======== probe.log ========"
            adb shell cat "$D/probe.log" || echo "(no log)"
            echo "==========================="
            if [ "${ok:-}" = "1" ]; then echo "OFFLINE COMPILE: PASS"; else echo "OFFLINE COMPILE: FAIL"; exit 1; fi
