name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the template app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :runner:assembleRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Pack the template into صانع التطبيقات
        run: python3 ci/prepare_template.py

      - name: Test the engine and build صانع التطبيقات
        run: |
          ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Compiler errors (1)
        if: failure()
        run: |
          P="file:///home/runner/work/html-ila-apk/html-ila-apk/"
          grep -E "^e: |ERROR:|error: |FAILED|Exception" build.log | sed "s#$P##" | sort -u | sed -n '1,10p' | while IFS= read -r l; do echo "::error::$l"; done
          grep -A3 "What went wrong" build.log | head -12 | while IFS= read -r l; do echo "::warning::$l"; done
      - name: Compiler errors (2)
        if: failure()
        run: |
          P="file:///home/runner/work/html-ila-apk/html-ila-apk/"
          grep -E "^e: |ERROR:|error: " build.log | sed "s#$P##" | sort -u | sed -n '11,25p' | while IFS= read -r l; do echo "::error::$l"; done
      - name: Unit test report
        if: failure()
        run: |
          find app/build/test-results -name "*.xml" -exec grep -h -A8 "<failure" {} \; | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Check the app made by the test
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner verify -v app/build/test-out/sample.apk
          $BT/aapt2 dump badging app/build/test-out/sample.apk | head -12

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/html-ila-apk.apk
          cp app/build/test-out/sample.apk out/sample.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Try everything on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/smoke.sh

      - name: Save screenshots and logs (ci-results branch)
        if: always()
        run: |
          mkdir -p smoke-out
          cd smoke-out
          git init -q -b ci-results
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "run ${{ github.run_number }} ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -qm "smoke test run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: صانع التطبيقات 1.0.${{ github.run_number }}
          body: |
            حمّل **html-ila-apk.apk** وثبّتو على التليفون.
            كل نسخة جديدة تتثبّت فوق القديمة من غير ما تفسخ تطبيقاتك.
          files: out/html-ila-apk.apk
          make_latest: true
